name: MLOps Automation Pipeline

on:
  push:
    branches:
      - experiment/lk8-automation
      - main
  pull_request:
    branches:
      - main

jobs:
  testing:
    name: Automated Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc dagshub

      - name: Run unit tests
        run: pytest -v

  ml_pipeline:
    name: Training Evaluation Registry
    runs-on: ubuntu-latest
    needs: testing

    env:
      MLFLOW_TRACKING_URI: https://dagshub.com/alyaarhm/MLOps-TempCast-Malang.mlflow
      MLFLOW_TRACKING_USERNAME: alyaarhm
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install dvc dagshub

      - name: Configure DVC remote authentication
        run: |
          dvc remote modify --local dagshub auth basic
          dvc remote modify --local dagshub user alyaarhm
          dvc remote modify --local dagshub password "${{ secrets.DAGSHUB_TOKEN }}"

      - name: Pull latest dataset from DVC
        run: |
          dvc pull

      - name: Automated training
        run: |
          python src/train.py

      - name: Model evaluation and validation
        run: |
          python src/evaluate_and_register.py

      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: lk08-experiment-results
          path: lk06_experiment_results.csv
