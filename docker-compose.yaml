services:
  postgres-db:
    image: postgres:16-alpine
    container_name: tempcast-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow
      POSTGRES_DB: mlflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tempcast-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U mlflow -d mlflow"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mlflow-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempcast-mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:mlflow@postgres-db:5432/mlflow
      - --artifacts-destination
      - /mlflow/artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "*"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
    networks:
      - tempcast-network
    depends_on:
      postgres-db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  api-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tempcast-api
    command:
      - uvicorn
      - src.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
      MODEL_NAME: TempCast-Malang-LK09-Model
    ports:
      - "8000:8000"
    networks:
      - tempcast-network
    depends_on:
      mlflow-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

networks:
  tempcast-network:
    driver: bridge

volumes:
  postgres_data:
  mlflow_artifacts:
